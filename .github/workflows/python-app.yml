name: Python CI_test
on:
  schedule:
    # GitHub Actions 使用 UTC 时间，23:00 UTC = 次日 07:00 (Asia/Shanghai)
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.8'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install requests
    - name: Configure credentials
      env:
        QWEATHER_KEY: ${{ secrets.QWEATHER_KEY }}
        QWEATHER_HOST: ${{ secrets.QWEATHER_HOST }}
      run: |
        printf "KEY = '%s'\nAPI_HOST = '%s'\n" "$QWEATHER_KEY" "$QWEATHER_HOST" > myKey.py
    - name: Run Python script
      env:
        QWEATHER_WECHAT_WEBHOOK: ${{ secrets.QWEATHER_WECHAT_WEBHOOK }}
      run: python QWeatherAPI.py
